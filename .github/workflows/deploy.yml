name: Deploy App

on:
push:
branches:
- main

jobs:
deploy:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Deploy to EC2
    uses: appleboy/ssh-action@v1
    with:
      host: ${{ secrets.HOST }}
      username: ec2-user
      key: ${{ secrets.EC2_SSH_KEY }}
      debug: true
      script: |
        cd /home/ec2-user
        if [ ! -d "app" ]; then
          git clone https://github.com/surya1519/CICDAPP.git app
        fi
        cd app
        git pull origin main
        npm install
        pkill node || true
        nohup npm start > app.log 2>&1 &
